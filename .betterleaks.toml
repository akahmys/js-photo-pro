# Betterleaks Configuration for js-photo-pro

[extend]
useDefault = true

[[rules]]
id = "absolute-local-path"
description = "Detects hardcoded local absolute paths (home directory paths in macOS/Windows)"
keywords = ["/Users/", "\\Users\\", "/users/", "\\users\\"]
regex = '''(?i)(?:/Users/[a-zA-Z0-9_-]+/|[a-zA-Z]:[\\/]Users[\\/][a-zA-Z0-9_-]+[\\/])'''
confidence = "high"
